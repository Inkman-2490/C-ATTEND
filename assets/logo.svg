<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">C-Attend logo</title>
  <desc id="desc">An attendance checklist clipboard with a check mark</desc>
  <defs>
    <linearGradient id="background" x1="10" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f73b9"/>
      <stop offset=".55" stop-color="#1d4e89"/>
      <stop offset="1" stop-color="#071b2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="31" y1="34" x2="68" y2="75" gradientUnits="userSpaceOnUse">
