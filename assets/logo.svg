  <path d="M33 37h4M33 50h4M33 63h4" stroke="#1d4e89" stroke-linecap="round" stroke-width="4"/>
  <path d="M44 37h18M44 50h18M44 63h10" stroke="#7ea8d0" stroke-linecap="round" stroke-width="3"/>
  <circle cx="65" cy="63" r="12" fill="#1d4e89"/>
